events {
  worker_connections 1024;
}

http {
  gzip off;

  server {
    listen 80;
    server_name internet-checker.online www.internet-checker.online;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host:8443$request_uri;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name internet-checker.online www.internet-checker.online;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/internet-checker.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/internet-checker.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://app:8000;
      proxy_http_version 1.1;

      proxy_buffering off;
      proxy_request_buffering off;

      proxy_read_timeout 30s;
      proxy_send_timeout 30s;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}